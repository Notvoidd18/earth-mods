services:
  - type: web
    name: earth-mods
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        value: https://earth-mods.onrender.com
        # Canonical custom domain or Render service URL (e.g. https://earth-mods.onrender.com)
      - key: SEO_INDEXING_ENABLED
        value: "false"
        # Set to "true" in Render Dashboard once verified on canonical custom domain
      - key: DATABASE_URL
        sync: false
        # Populate with your Aiven PostgreSQL URL:
        # postgres://<user>:<password>@<host>:<port>/<dbname>?sslmode=require
      - key: SESSION_SECRET
        generateValue: true
      - key: VOTER_SALT
        generateValue: true
      - key: ADMIN_BOOTSTRAP_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_USERNAME
        value: archon_prime
      - key: INITIAL_ADMIN_EMAIL
        value: directorate@earthmods.internal
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
